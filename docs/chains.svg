<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 650" role="img" aria-labelledby="title desc"><title id="title">Two independent scientific workflows</title><desc id="desc">Schematic workflow only, no biological results. Host markers are aligned separately and concatenated for IQ-TREE. Independent R-M calls use ordered genes and GFF, DefenseFinder and review.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#526d64"/></marker></defs><rect width="850" height="650" fill="#fff" rx="12"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#173c37"><text x="425" y="40" font-size="13" letter-spacing="2">WORKFLOW SCHEMATIC · NO LIVE RESULT</text><rect x="255" y="62" width="340" height="66" rx="8" fill="#e5eddf"/><text x="425" y="90" font-size="19" font-weight="600">177 frozen LAB RefSeq genomes</text><text x="425" y="113" font-size="13">10 groups · no Enterococcus</text><text x="215" y="173" font-size="16" font-weight="700">HOST PHYLOGENY</text><text x="635" y="173" font-size="16" font-weight="700">INDEPENDENT R-M ANNOTATION</text><g fill="none" stroke="#526d64" stroke-width="2" marker-end="url(#arrow)"><path d="M320 128v17H215v43M530 128v17h105v43M215 255v32M215 355v32M215 455v32M635 255v32M635 355v32M635 455v32"/></g><g fill="#f2f6ef" stroke="#a7bba9"><rect x="45" y="192" width="340" height="64" rx="6"/><rect x="45" y="292" width="340" height="64" rx="6"/><rect x="45" y="392" width="340" height="64" rx="6"/><rect x="45" y="492" width="340" height="64" rx="6"/><rect x="465" y="192" width="340" height="64" rx="6"/><rect x="465" y="292" width="340" height="64" rx="6"/><rect x="465" y="392" width="340" height="64" rx="6"/><rect x="465" y="492" width="340" height="64" rx="6"/></g><g font-size="17" font-weight="600"><text x="215" y="219">Conserved single-copy proteins</text><text x="215" y="319">Separate marker alignments</text><text x="215" y="419">Concatenated protein matrix</text><text x="215" y="519">IQ-TREE + support estimates</text><text x="635" y="219">Ordered per-replicon genes + GFF</text><text x="635" y="319">DefenseFinder candidate calls</text><text x="635" y="419">Review with context + sources</text><text x="635" y="519">I / II (including IIG) / III / IV rings</text></g><g font-size="13"><text x="215" y="242">GToTree / HMMER · audit orthology</text><text x="215" y="342">MAFFT → trimAl · review each marker</text><text x="215" y="442">Partitions · taxon order · missing-data mask</text><text x="215" y="542">Model · seed · support method · run receipt</text><text x="635" y="242">Exact protein IDs · coordinates · replicon order</text><text x="635" y="342">Versioned models · input identity · failures</text><text x="635" y="442">REBASE / literature · U distinct from P</text><text x="635" y="542">Reviewed annotations joined by accession</text></g><path d="M215 566v22h420v-22" fill="none" stroke="#526d64" stroke-width="2" stroke-dasharray="5 5"/><text x="425" y="621" font-size="14">Join only at the figure layer. A complete model does not prove function.</text></g></svg>
