name: GenomeAtlas verified Pages artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genomeatlas-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build.py
      - run: python -B -m unittest discover -s tests -v
      - run: node --test tests/core.test.mjs tests/acceptance.test.js
      - run: python -B -m unittest discover -s probes/tests -v
      - uses: actions/upload-pages-artifact@v4
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
